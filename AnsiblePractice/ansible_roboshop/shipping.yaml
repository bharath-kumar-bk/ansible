- name: shipping service
  hosts: shipping
  become: true

  tasks:

   - name: install maven
     ansible.builtin.dnf:
       name: maven
       state: present

   - name: create system user
     ansible.builtin.user:
       name: roboshop
       shell: /sbin/nologin
       system: true
       home: /app

   - name: create app directory
     ansible.builtin.file:
       path: /app
       state: directory

   - name: download shipping
     ansible.builtin.get_url:
       url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
       dest: /tmp/shipping.zip

   - name: extract shipping
     ansible.builtin.unarchive:
       src: /tmp/shipping.zip
       dest: /app
       remote_src: true

   - name: build shipping
     ansible.builtin.command: mvn clean package
     args:
       chdir: /app

   - name: rename jar
     ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
     args:
       chdir: /app
       creates: /app/shipping.jar

   - name: copy shipping service
     ansible.builtin.copy:
       src: shipping.service
       dest: /etc/systemd/system/shipping.service

   - name: daemon reload
     ansible.builtin.systemd_service:
       daemon_reload: true

   - name: install mysql client
     ansible.builtin.dnf:
       name: mysql
       state: present

   - name: load schema
     ansible.builtin.shell: mysql -h 172.31.27.78 -uroot -pRoboShop@1 < /app/db/schema.sql

   - name: load app user
     ansible.builtin.shell: mysql -h 172.31.27.78 -uroot -pRoboShop@1 < /app/db/app-user.sql

   - name: load master data
     ansible.builtin.shell: mysql -h 172.31.27.78 -uroot -pRoboShop@1 < /app/db/master-data.sql

   - name: start and enable shipping
     ansible.builtin.service:
       name: shipping
       state: started
       enabled: true