- name: Mysql service
  hosts: Mysql
  become: true

  tasks:

   - name: install mysql
     ansible.builtin.dnf:
       name: mysql-server
       state: present

   - name: start and enable mysql
     ansible.builtin.service:
       name: mysqld
       state: started
       enabled: true

   - name: set root password
     ansible.builtin.shell: mysql_secure_installation --set-root-pass RoboShop@1