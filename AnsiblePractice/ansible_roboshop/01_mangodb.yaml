- name: instaing mangodb
  hosts: mongodb
  become: true

  tasks:
   - name: copy the mongo repo
     ansible.builtin.copy:
       src: mongo.repo
       dest: /etc/yum.repos.d/mongo.repo

   - name: instaing mongodb
     ansible.builtin.dnf:
       name: mongodb-org
       state: present

   - name: allowing port
     ansible.builtin.replace:
       path: /etc/mongod.conf
       regexp: '127.0.0.1'
       replace: '0.0.0.0'

   - name: enable the serveice
     ansible.builtin.service:
       name: mongod
       state: started
       enabled: yes